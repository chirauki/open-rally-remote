# Builds and tests the XIAO firmware. A push of a tag fw-v<version> also makes a
# draft GitHub release with the files; a maintainer checks it and publishes it.
# The tag must match FIRMWARE_VERSION in the sketch and be on main.
name: firmware

on:
  push:
    branches: [main]
    tags: ['fw-v*']
    paths:
      - 'firmware/xiao-nrf52840/**'
      - '.github/workflows/firmware.yml'
  pull_request:
    paths:
      - 'firmware/xiao-nrf52840/**'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE: Seeeduino:nrf52@1.1.13
  CORE_URL: https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
  NRFUTIL: adafruit-nrfutil==0.5.3.post16

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        if: startsWith(github.ref, 'refs/tags/fw-v')
        run: |
          tag=${GITHUB_REF_NAME#fw-v}
          version=$(sed -n 's/^const char \*const FIRMWARE_VERSION = "\(.*\)";/\1/p' firmware/xiao-nrf52840/open-rally-remote.ino)
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match FIRMWARE_VERSION $version"; exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is not on main"; exit 1
          fi

      - name: Host tests
        run: make -C firmware/xiao-nrf52840/test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install adafruit-nrfutil
        run: pip install "$NRFUTIL"

      - uses: arduino/setup-arduino-cli@v2
        with:
          version: 1.5.1

      - name: Install the Seeed core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls "$CORE_URL"
          arduino-cli core update-index
          arduino-cli core install "$CORE"

      - name: Build
        run: firmware/xiao-nrf52840/release/build.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/fw-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist

      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#fw-v}
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{TAG}}/$GITHUB_REF_NAME/g" -e "s/{{CORE}}/${CORE#*@}/g" \
            firmware/xiao-nrf52840/release/notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --draft \
            --title "Firmware $version" --notes-file notes.md
