<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980" role="img" aria-labelledby="title desc">
  <title id="title">XIAO nRF52840 bench prototype on a breadboard</title>
  <desc id="desc">Top-down wiring illustration. Eight momentary switches straddle the breadboard center trench. Their individual signals connect to XIAO pins D0 through D7 and their other contacts share ground. The XIAO is outside the breadboard and powered by USB-C.</desc>
  <defs>
    <linearGradient id="board" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#27313a"/><stop offset="1" stop-color="#111820"/></linearGradient>
    <linearGradient id="breadboard" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e9edf0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#17212b" flood-opacity=".15"/></filter>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#17212b}.subtitle{font:16px Arial,sans-serif;fill:#55616d}
      .label{font:700 15px Arial,sans-serif;fill:#27313a}.small{font:13px Arial,sans-serif;fill:#55616d}.tiny{font:11px Arial,sans-serif;fill:#66727e}
      .pin{font:700 12px Arial,sans-serif;fill:#fff}.rail{font:700 13px Arial,sans-serif}
    </style>
    <pattern id="holes" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="12" cy="12" r="3.3" fill="#c3cbd1"/><circle cx="11" cy="11" r="1.2" fill="#fff" opacity=".85"/></pattern>
  </defs>
  <rect width="1500" height="980" fill="#f5f7f8"/>
  <text x="70" y="65" class="title">XIAO nRF52840 — bench input prototype</text>
  <text x="70" y="96" class="subtitle">Eight temporary momentary switches represent buttons A–C and joystick directions + optional center press.</text>

  <!-- Breadboard body -->
  <g filter="url(#shadow)"><rect x="58" y="155" width="925" height="665" rx="24" fill="url(#breadboard)" stroke="#c9d0d6" stroke-width="2"/></g>
  <text x="85" y="188" class="small">400-point solderless breadboard · top view</text>
  <!-- top rails -->
  <rect x="95" y="210" width="850" height="35" rx="8" fill="#fff" stroke="#d3d9de"/>
  <line x1="115" y1="227" x2="925" y2="227" stroke="#c94643" stroke-width="3"/>
  <text x="110" y="218" class="rail" fill="#bd3c3c">+  unused</text>
  <rect x="95" y="252" width="850" height="35" rx="8" fill="#fff" stroke="#d3d9de"/>
  <line x1="115" y1="269" x2="925" y2="269" stroke="#4778a8" stroke-width="3"/>
  <text x="110" y="260" class="rail" fill="#356a9b">−  GND</text>
  <!-- terminal field -->
  <rect x="95" y="310" width="850" height="445" rx="12" fill="#f7f9fa" stroke="#d3d9de"/>
  <rect x="125" y="330" width="360" height="400" fill="url(#holes)"/>
  <rect x="555" y="330" width="360" height="400" fill="url(#holes)"/>
  <rect x="495" y="310" width="50" height="445" fill="#e1e6ea"/>
  <line x1="520" y1="320" x2="520" y2="745" stroke="#c5cdd3" stroke-dasharray="5 7"/>
  <text x="272" y="322" class="tiny">a b c d e · connected row groups</text>
  <text x="650" y="322" class="tiny">f g h i j · connected row groups</text>
  <text x="470" y="776" class="tiny">center trench</text>
  <!-- row numbers -->
  <g class="tiny" text-anchor="end">
    <text x="116" y="377">5</text><text x="116" y="425">10</text><text x="116" y="473">15</text><text x="116" y="521">20</text>
    <text x="116" y="569">25</text><text x="116" y="617">30</text><text x="116" y="665">35</text><text x="116" y="713">40</text>
  </g>
  <!-- switch labels -->
  <g class="small" text-anchor="end">
    <text x="255" y="373">A · D0</text><text x="255" y="421">B · D1</text><text x="255" y="469">C · D2</text>
    <text x="255" y="517">UP · D3</text><text x="255" y="565">DOWN · D4</text><text x="255" y="613">LEFT · D5</text>
    <text x="255" y="661">RIGHT · D6</text><text x="255" y="709">CENTER · D7*</text>
  </g>
  <!-- coloured signal wires from XIAO breakout zone to left switch pads -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="4">
    <path d="M1100 310 H1010 V365 H468" stroke="#d04d45"/>
    <path d="M1100 342 H1022 V413 H468" stroke="#df8b32"/>
    <path d="M1100 374 H1034 V461 H468" stroke="#c2a52c"/>
    <path d="M1100 406 H1046 V509 H468" stroke="#4a9a67"/>
    <path d="M1100 438 H1058 V557 H468" stroke="#34899b"/>
    <path d="M1100 470 H1070 V605 H468" stroke="#4276b5"/>
    <path d="M1100 502 H1082 V653 H468" stroke="#7e64ad"/>
    <path d="M1100 534 H1094 V701 H468" stroke="#ac638f"/>
  </g>
  <!-- switches across trench: realistic 4-leg tactile switch bodies and pins -->
  <g>
    <g transform="translate(520 365)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 413)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 461)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 509)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 557)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 605)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 653)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
    <g transform="translate(520 701)"><rect x="-36" y="-13" width="72" height="26" rx="5" fill="#292e34" stroke="#101419" stroke-width="2"/><rect x="-12" y="-9" width="24" height="18" rx="3" fill="#454d55"/><path d="M-26 -13v-9 M26 -13v-9 M-26 13v9 M26 13v9" stroke="#9da8b1" stroke-width="3"/></g>
  </g>
  <!-- signal row endpoints and ground wires -->
  <g fill="#f8fafb" stroke-width="3">
    <circle cx="468" cy="365" r="6" stroke="#d04d45"/><circle cx="468" cy="413" r="6" stroke="#df8b32"/><circle cx="468" cy="461" r="6" stroke="#c2a52c"/><circle cx="468" cy="509" r="6" stroke="#4a9a67"/>
    <circle cx="468" cy="557" r="6" stroke="#34899b"/><circle cx="468" cy="605" r="6" stroke="#4276b5"/><circle cx="468" cy="653" r="6" stroke="#7e64ad"/><circle cx="468" cy="701" r="6" stroke="#ac638f"/>
  </g>
  <g fill="none" stroke="#343d45" stroke-width="3" stroke-linecap="round">
    <path d="M572 365 H820 V269"/><path d="M572 413 H834 V269"/><path d="M572 461 H848 V269"/><path d="M572 509 H862 V269"/>
    <path d="M572 557 H876 V269"/><path d="M572 605 H890 V269"/><path d="M572 653 H904 V269"/><path d="M572 701 H918 V269"/>
    <path d="M1370 442 H1450 V830 H990 V269 H945" stroke-width="5"/>
  </g>
  <text x="1002" y="815" class="tiny" fill="#343d45">XIAO GND → blue rail</text>
  <g fill="#343d45"><circle cx="572" cy="365" r="4"/><circle cx="572" cy="413" r="4"/><circle cx="572" cy="461" r="4"/><circle cx="572" cy="509" r="4"/><circle cx="572" cy="557" r="4"/><circle cx="572" cy="605" r="4"/><circle cx="572" cy="653" r="4"/><circle cx="572" cy="701" r="4"/></g>

  <!-- XIAO board -->
  <g filter="url(#shadow)">
    <rect x="1080" y="205" width="340" height="425" rx="20" fill="url(#board)" stroke="#0b1015" stroke-width="3"/>
    <rect x="1115" y="247" width="270" height="195" rx="10" fill="#33404a" stroke="#596773"/>
    <rect x="1170" y="285" width="155" height="95" rx="5" fill="#15212b" stroke="#76818a"/>
    <text x="1247" y="322" text-anchor="middle" class="pin" font-size="15">nRF52840</text>
    <text x="1247" y="347" text-anchor="middle" class="tiny" fill="#d0d7dc">BLE microcontroller</text>
    <rect x="1200" y="214" width="102" height="31" rx="7" fill="#c7ccd0" stroke="#8d969d"/>
    <path d="M1221 220v18 M1234 220v18 M1247 220v18 M1260 220v18 M1273 220v18" stroke="#879199" stroke-width="3"/>
    <text x="1250" y="195" class="small" text-anchor="middle">USB-C · power + programming</text>
    <!-- pin labels and headers -->
    <g class="tiny" text-anchor="end">
      <text x="1128" y="318" fill="#d04d45">D0</text><text x="1128" y="350" fill="#df8b32">D1</text><text x="1128" y="382" fill="#c2a52c">D2</text><text x="1128" y="414" fill="#4a9a67">D3</text>
    </g>
    <g class="tiny">
      <text x="1392" y="318" fill="#34899b">D4</text><text x="1392" y="350" fill="#4276b5">D5</text><text x="1392" y="382" fill="#7e64ad">D6</text><text x="1392" y="414" fill="#ac638f">D7</text><text x="1392" y="446" fill="#cbd3d9">GND</text>
    </g>
    <g fill="#d6a54a" stroke="#f0c879" stroke-width="1">
      <circle cx="1145" cy="314" r="7"/><circle cx="1145" cy="346" r="7"/><circle cx="1145" cy="378" r="7"/><circle cx="1145" cy="410" r="7"/>
      <circle cx="1370" cy="314" r="7"/><circle cx="1370" cy="346" r="7"/><circle cx="1370" cy="378" r="7"/><circle cx="1370" cy="410" r="7"/><circle cx="1370" cy="442" r="7"/>
    </g>
    <text x="1250" y="493" text-anchor="middle" class="pin" font-size="17">SEEED XIAO</text>
    <text x="1250" y="520" text-anchor="middle" class="small" fill="#c4cdd4">nRF52840 · standard version</text>
    <text x="1250" y="548" text-anchor="middle" class="tiny" fill="#a9b3bb">soldered 2.54 mm headers</text>
    <path d="M1220 580 h60" stroke="#df8b32" stroke-width="5" stroke-linecap="round"/>
    <text x="1250" y="608" text-anchor="middle" class="tiny" fill="#cad2d8">USB powered on the bench</text>
  </g>
  <!-- explanatory key -->
  <g transform="translate(1050 690)">
    <text x="0" y="0" class="label">How to read the wiring</text>
    <line x1="0" y1="28" x2="70" y2="28" stroke="#4276b5" stroke-width="4"/><text x="84" y="33" class="small">Individual signal lead: XIAO GPIO → one switch side</text>
    <line x1="0" y1="58" x2="70" y2="58" stroke="#343d45" stroke-width="3"/><text x="84" y="63" class="small">Shared ground: other switch side → blue negative rail</text>
    <text x="0" y="98" class="small">Switches bridge the center trench. Do not connect GPIOs to the red + rail.</text>
    <text x="0" y="128" class="small">* D7 is optional for a joystick without a center-click switch.</text>
  </g>
  <rect x="58" y="855" width="1365" height="72" rx="12" fill="#fff5df" stroke="#edcf8a"/>
  <text x="82" y="884" class="label" fill="#765317">Bench prototype only</text>
  <text x="82" y="908" class="small">Breadboards and exposed jumper wires are not vibration-proof or weatherproof. Do not mount this setup on a motorcycle or use it while riding.</text>
</svg>
