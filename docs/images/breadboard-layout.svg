<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
<title id="title">XIAO nRF52840 breadboard switch wiring diagram</title>
<desc id="desc">A clear, non-crossing wiring diagram for eight switches. Each GPIO wire connects the XIAO to one side of a switch; the other side connects to a common ground rail.</desc>
<defs>
 <linearGradient id="pcb" x2="0" y2="1"><stop stop-color="#29343e"/><stop offset="1" stop-color="#131a20"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#14202a" flood-opacity=".16"/></filter>
 <style>
 .title{font:700 36px Arial,sans-serif;fill:#17212b}.sub{font:17px Arial,sans-serif;fill:#52616c}.h{font:700 19px Arial,sans-serif;fill:#25333d}.body{font:15px Arial,sans-serif;fill:#34444f}.small{font:13px Arial,sans-serif;fill:#53636e}.tiny{font:12px Arial,sans-serif;fill:#63717a}.pin{font:700 14px Arial,sans-serif;fill:#f9fbfc}.wire{fill:none;stroke-linecap:round;stroke-linejoin:round}
 </style>
</defs>
<rect width="1600" height="1120" fill="#f4f7f8"/>
<text x="60" y="62" class="title">Breadboard wiring · no crossing leads</text>
<text x="60" y="95" class="sub">One GPIO signal per switch; the opposite switch terminal goes to the shared GND rail.</text>

<!-- XIAO outside the breadboard -->
<g filter="url(#shadow)">
 <rect x="55" y="150" width="270" height="660" rx="22" fill="url(#pcb)" stroke="#0c1217" stroke-width="3"/>
 <rect x="137" y="160" width="105" height="28" rx="7" fill="#c5cbd0" stroke="#808b93"/>
 <text x="190" y="145" text-anchor="middle" class="small">USB-C · data and power</text>
 <rect x="112" y="215" width="156" height="110" rx="9" fill="#18232b" stroke="#71808b"/>
 <text x="190" y="262" text-anchor="middle" class="pin" font-size="18">nRF52840</text>
 <text x="190" y="289" text-anchor="middle" font-family="Arial" font-size="13" fill="#cad2d8">Bluetooth LE</text>
 <text x="190" y="365" text-anchor="middle" class="pin" font-size="18">SEEED XIAO</text>
 <text x="190" y="391" text-anchor="middle" font-family="Arial" font-size="13" fill="#ccd3d9">nRF52840 · pre-soldered</text>
</g>

<!-- breadboard body and center trench -->
<g filter="url(#shadow)"><rect x="365" y="150" width="900" height="660" rx="22" fill="#fff" stroke="#c4cdd3" stroke-width="2"/></g>
<text x="400" y="190" class="h">400-point breadboard · wiring view</text>
<text x="432" y="224" class="tiny">GPIO side</text><text x="695" y="224" class="tiny">center trench</text><text x="970" y="224" class="tiny">GND side</text>
<rect x="680" y="230" width="50" height="535" fill="#e6ebee"/>
<line x1="705" y1="238" x2="705" y2="755" stroke="#c4cdd3" stroke-dasharray="5 7"/>
<rect x="402" y="240" width="250" height="510" fill="#f8fafb" stroke="#e1e6e9"/>
<rect x="758" y="240" width="465" height="510" fill="#f8fafb" stroke="#e1e6e9"/>

<!-- common ground rail -->
<rect x="790" y="265" width="390" height="42" rx="8" fill="#edf4fa" stroke="#c8d8e5"/>
<line x1="812" y1="286" x2="1150" y2="286" stroke="#3e79ad" stroke-width="5"/>
<text x="820" y="280" font-family="Arial" font-size="13" font-weight="700" fill="#356a9b">− COMMON GROUND (GND)</text>
<path d="M1150 286 H1200" class="wire" stroke="#27323a" stroke-width="5"/>

<!-- switch labels -->
<g class="tiny">
 <text x="420" y="336">Button A</text><text x="420" y="396">Button B</text><text x="420" y="456">Button C</text>
 <text x="420" y="516">Joystick UP</text><text x="420" y="576">Joystick DOWN</text><text x="420" y="636">Joystick LEFT</text>
 <text x="420" y="696">Joystick RIGHT</text><text x="420" y="756">Center press*</text>
</g>

<!-- GPIO leads: each uses its own horizontal row, from XIAO to one switch terminal -->
<g class="wire" stroke-width="5">
 <path d="M325 354 H673" stroke="#d24f45"/><path d="M325 414 H673" stroke="#de8e32"/>
 <path d="M325 474 H673" stroke="#c0a52a"/><path d="M325 534 H673" stroke="#459669"/>
 <path d="M325 594 H673" stroke="#328b9c"/><path d="M325 654 H673" stroke="#4276b6"/>
 <path d="M325 714 H673" stroke="#8063ae"/><path d="M325 774 H673" stroke="#ad638f"/>
</g>
<!-- GPIO pads and labels on the XIAO -->
<g font-family="Arial" font-size="13" font-weight="700" fill="#f9fbfc" text-anchor="end">
 <text x="305" y="359">D0</text><text x="305" y="419">D1</text><text x="305" y="479">D2</text><text x="305" y="539">D3</text>
 <text x="305" y="599">D4</text><text x="305" y="659">D5</text><text x="305" y="719">D6</text><text x="305" y="779">D7</text>
</g>
<g fill="#d6a74c" stroke="#f4d08a" stroke-width="1">
 <circle cx="325" cy="354" r="6"/><circle cx="325" cy="414" r="6"/><circle cx="325" cy="474" r="6"/><circle cx="325" cy="534" r="6"/>
 <circle cx="325" cy="594" r="6"/><circle cx="325" cy="654" r="6"/><circle cx="325" cy="714" r="6"/><circle cx="325" cy="774" r="6"/>
</g>

<!-- switch bodies straddle the trench; GPIO side is left, GND side is right -->
<g fill="#252b31" stroke="#11171b" stroke-width="2">
 <g transform="translate(705 354)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 414)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 474)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 534)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 594)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 654)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 714)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
 <g transform="translate(705 774)"><rect x="-32" y="-15" width="64" height="30" rx="6"/><rect x="-10" y="-10" width="20" height="20" rx="4" fill="#505962" stroke="#69747d"/></g>
</g>
<!-- switch lead endpoints, and independent GND leads to a common ground rail -->
<g stroke-width="5" class="wire">
 <path d="M737 354 H825 V286" stroke="#27323a"/><path d="M737 414 H865 V286" stroke="#27323a"/>
 <path d="M737 474 H905 V286" stroke="#27323a"/><path d="M737 534 H945 V286" stroke="#27323a"/>
 <path d="M737 594 H985 V286" stroke="#27323a"/><path d="M737 654 H1025 V286" stroke="#27323a"/>
 <path d="M737 714 H1065 V286" stroke="#27323a"/><path d="M737 774 H1105 V286" stroke="#27323a"/>
</g>
<g fill="#27323a"><circle cx="737" cy="354" r="4"/><circle cx="737" cy="414" r="4"/><circle cx="737" cy="474" r="4"/><circle cx="737" cy="534" r="4"/><circle cx="737" cy="594" r="4"/><circle cx="737" cy="654" r="4"/><circle cx="737" cy="714" r="4"/><circle cx="737" cy="774" r="4"/></g>
<!-- XIAO GND lead -->
<text x="82" y="830" class="small">XIAO GND</text><path d="M145 850 H350 V875 H1200 V286" class="wire" stroke="#27323a" stroke-width="5"/>

<!-- explanation -->
<rect x="55" y="900" width="1490" height="150" rx="16" fill="#fff" stroke="#d7dfe4"/>
<text x="82" y="938" class="h">How to read the connections</text>
<text x="82" y="970" class="body">Each colored line is one male-to-female jumper from a XIAO GPIO pin to one side of its switch.</text>
<text x="82" y="997" class="body">Each dark line is a separate male-to-male jumper from the opposite switch side to the blue GND rail.</text>
<text x="82" y="1024" class="body">With INPUT_PULLUP enabled: released = HIGH; pressed = GPIO connected to GND = LOW. No red + rail connection.</text>
<text x="82" y="1075" class="tiny">* D7 and the eighth switch are optional. Diagram is a wiring view; identify the internally joined switch-leg pairs before inserting.</text>
</svg>
