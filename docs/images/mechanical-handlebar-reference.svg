<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Open Rally Remote concept shown on a motorcycle handlebar</title>
  <desc id="desc">An illustrative motorcycle handlebar with grips, switchgear, clutch and brake levers, and an orange compact remote pod mounted beside the left controls. The remote has three vertically arranged buttons and a five-way joystick below.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f5f7fa"/><stop offset="1" stop-color="#e8edf2"/></linearGradient>
    <linearGradient id="bar" x2="0" y2="1"><stop stop-color="#9da8b2"/><stop offset=".45" stop-color="#4b5661"/><stop offset="1" stop-color="#26313a"/></linearGradient>
    <linearGradient id="grip" x2="0" y2="1"><stop stop-color="#444b50"/><stop offset=".45" stop-color="#171b1e"/><stop offset="1" stop-color="#080a0b"/></linearGradient>
    <linearGradient id="pod" x2="1" y2="1"><stop stop-color="#ffb348"/><stop offset=".55" stop-color="#ef781b"/><stop offset="1" stop-color="#ba4e0b"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#16212b" flood-opacity=".22"/></filter>
    <pattern id="ribs" width="12" height="12" patternUnits="userSpaceOnUse"><path d="M1 0v12" stroke="#737c82" stroke-width="2" opacity=".45"/></pattern>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <text x="70" y="72" font-family="Arial, sans-serif" font-size="25" font-weight="700" letter-spacing="2" fill="#66727d">OPEN RALLY REMOTE · MECHANICAL CONCEPT</text>
  <text x="70" y="116" font-family="Arial, sans-serif" font-size="17" fill="#66727d">Illustrative fit reference only · proportions and mounting position are not validated</text>

  <!-- Handlebar cross tube and central riser -->
  <path d="M122 372 C325 342 488 344 642 365 C824 390 1018 387 1272 350" fill="none" stroke="#18212a" stroke-width="43" stroke-linecap="round" opacity=".18" transform="translate(0 16)"/>
  <path d="M122 354 C325 324 488 326 642 347 C824 372 1018 369 1272 332" fill="none" stroke="url(#bar)" stroke-width="38" stroke-linecap="round"/>
  <path d="M625 363l-8 77h160l-14-81" fill="#65717b" stroke="#3a444d" stroke-width="7"/>
  <path d="M604 435h181v28H604z" rx="8" fill="#3b454e"/>
  <path d="M618 447h153" stroke="#aeb7bf" stroke-width="3" opacity=".65"/>

  <!-- Left and right hand grips -->
  <g transform="rotate(-5 245 350)">
    <rect x="76" y="316" width="247" height="76" rx="30" fill="url(#grip)" stroke="#0b0d0f" stroke-width="5"/>
    <rect x="80" y="318" width="238" height="72" rx="27" fill="url(#ribs)" opacity=".72"/>
    <ellipse cx="80" cy="354" rx="13" ry="37" fill="#101416"/>
    <path d="M100 329h201" stroke="#747d82" stroke-width="3" opacity=".3"/>
  </g>
  <g transform="rotate(-5 1142 344)">
    <rect x="1010" y="307" width="300" height="76" rx="30" fill="url(#grip)" stroke="#0b0d0f" stroke-width="5"/>
    <rect x="1015" y="309" width="286" height="72" rx="27" fill="url(#ribs)" opacity=".72"/>
    <ellipse cx="1307" cy="345" rx="13" ry="37" fill="#101416"/>
  </g>

  <!-- Stock switchgear clusters -->
  <g filter="url(#shadow)">
    <path d="M331 301q0-18 18-20l78-3q18 0 23 17l8 71q2 17-16 22l-81 11q-18 2-22-16z" fill="#222a30" stroke="#101518" stroke-width="5"/>
    <path d="M351 309l38-5 3 23-38 5z" fill="#55616a"/>
    <path d="M404 302l29-3 3 19-29 4z" fill="#d8e0e5"/>
    <circle cx="368" cy="358" r="11" fill="#bd392b" stroke="#711e18" stroke-width="3"/>
    <path d="M1046 294q4-19 23-18l70 6q18 2 20 21l-2 62q-1 18-19 20l-73-2q-18-1-19-19z" fill="#222a30" stroke="#101518" stroke-width="5"/>
    <path d="M1062 305l40 3-2 22-39-3z" fill="#58636b"/>
    <circle cx="1129" cy="316" r="10" fill="#d6dce0"/>
    <path d="M1063 351h49" stroke="#8f9aa2" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Levers -->
  <path d="M347 294 C285 253 218 226 128 220 C103 219 89 225 77 238" fill="none" stroke="#8d989f" stroke-width="16" stroke-linecap="round"/>
  <path d="M347 294 C285 253 218 226 128 220" fill="none" stroke="#dce1e4" stroke-width="5" stroke-linecap="round" opacity=".7"/>
  <path d="M1111 287 C1147 239 1194 206 1263 184 C1289 176 1310 181 1324 195" fill="none" stroke="#8d989f" stroke-width="16" stroke-linecap="round"/>
  <path d="M1111 287 C1147 239 1194 206 1263 184" fill="none" stroke="#dce1e4" stroke-width="5" stroke-linecap="round" opacity=".7"/>

  <!-- Remote clamp and adjustable bracket -->
  <path d="M462 353 C455 379 450 400 450 421" fill="none" stroke="#202a32" stroke-width="14"/>
  <path d="M439 346q23-10 45 0l-5 33q-18 9-36 0z" fill="#343e47" stroke="#11171c" stroke-width="4"/>
  <path d="M438 350q23 9 46 0" fill="none" stroke="#9ca7ad" stroke-width="4"/>
  <circle cx="461" cy="373" r="5" fill="#d4d9dc"/>

  <!-- Remote body in a three-quarter view -->
  <g filter="url(#shadow)">
    <path d="M420 407l27-13 111 8 21 17-3 261-22 19-116-8-21-18z" fill="#a64c12" stroke="#77360f" stroke-width="5"/>
    <path d="M420 407l27-13 111 8-28 15z" fill="#ffbd61" opacity=".9"/>
    <path d="M447 402l111 10-2 257-111-8z" fill="url(#pod)" stroke="#8f410e" stroke-width="4"/>
    <path d="M460 418l82 7-2 224-82-7z" fill="#292f33" stroke="#15191c" stroke-width="5"/>
    <path d="M466 425l69 6" stroke="#858e92" stroke-width="3" opacity=".55"/>
    <!-- Three guarded, glove-sized buttons -->
    <g fill="#cbd1d3" stroke="#111619" stroke-width="5">
      <circle cx="501" cy="459" r="17"/><circle cx="500" cy="506" r="17"/><circle cx="499" cy="553" r="17"/>
    </g>
    <g fill="#f4f6f6" opacity=".72">
      <ellipse cx="496" cy="454" rx="7" ry="4"/><ellipse cx="495" cy="501" rx="7" ry="4"/><ellipse cx="494" cy="548" rx="7" ry="4"/>
    </g>
    <!-- Five-way joystick -->
    <circle cx="498" cy="610" r="28" fill="#11171a" stroke="#06090a" stroke-width="5"/>
    <circle cx="498" cy="610" r="19" fill="#59636a" stroke="#aeb6ba" stroke-width="3"/>
    <circle cx="498" cy="610" r="8" fill="#d5dadd"/>
    <path d="M498 586v8M498 626v8M474 610h8M514 610h8" stroke="#f3a23c" stroke-width="4" stroke-linecap="round"/>
    <path d="M457 679l81 5" stroke="#ffd093" stroke-width="3" opacity=".55"/>
  </g>

  <!-- Callouts -->
  <g font-family="Arial, sans-serif" fill="#34414b">
    <path d="M505 389L610 250h153" fill="none" stroke="#e16d16" stroke-width="3"/>
    <circle cx="505" cy="389" r="5" fill="#e16d16"/>
    <text x="770" y="245" font-size="17" font-weight="700">22 mm handlebar</text>
    <text x="770" y="269" font-size="14" fill="#66727d">Split clamp shown schematically</text>
    <path d="M546 470L735 437h120" fill="none" stroke="#e16d16" stroke-width="3"/>
    <circle cx="546" cy="470" r="5" fill="#e16d16"/>
    <text x="865" y="432" font-size="17" font-weight="700">3 tactile buttons</text>
    <text x="865" y="456" font-size="14" fill="#66727d">Vertical layout for thumb access</text>
    <path d="M525 610L730 620h125" fill="none" stroke="#e16d16" stroke-width="3"/>
    <circle cx="525" cy="610" r="5" fill="#e16d16"/>
    <text x="865" y="615" font-size="17" font-weight="700">5-way joystick</text>
    <text x="865" y="639" font-size="14" fill="#66727d">4 directions + optional center press</text>
    <path d="M378 342L252 465H104" fill="none" stroke="#71808b" stroke-width="2.5"/>
    <circle cx="378" cy="342" r="4" fill="#71808b"/>
    <text x="80" y="490" font-size="16" font-weight="700">Stock switchgear</text>
    <text x="80" y="513" font-size="14" fill="#66727d">Clearance must be checked on the bike</text>
    <path d="M299 232L224 154H95" fill="none" stroke="#71808b" stroke-width="2.5"/>
    <circle cx="299" cy="232" r="4" fill="#71808b"/>
    <text x="80" y="143" font-size="16" font-weight="700">Clutch lever</text>
    <path d="M1190 208L1204 145h115" fill="none" stroke="#71808b" stroke-width="2.5"/>
    <circle cx="1190" cy="208" r="4" fill="#71808b"/>
    <text x="1210" y="133" font-size="16" font-weight="700">Brake lever</text>
  </g>

  <rect x="70" y="748" width="1260" height="1" fill="#c5cdd3"/>
  <text x="70" y="785" font-family="Arial, sans-serif" font-size="14" fill="#66727d">Concept illustration · not to scale · enclosure, clamp, ergonomics, and weather sealing remain to be prototyped</text>
</svg>
